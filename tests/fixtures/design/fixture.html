<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parity fixture</title>
<style>
  :root { --ink: #1c1917; --paper: #fafaf9; --accent: #15803d; }
  body { margin: 0; font: 18px/1.5 Georgia, serif; color: var(--ink); background: var(--paper); }
  header, section { min-height: 100vh; padding: 48px 24px; box-sizing: border-box; }
  canvas { width: 100%; height: 50vh; display: block; }
  .pin { height: 300vh; position: relative; background: #e7e5e4; }
  .pin > div { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; font-size: 40px; }
</style>
</head>
<body>
  <header><h1>Parity fixture</h1><p>A heading, a WebGL canvas, a pinned (sticky) section and a footer: what design:capture has to handle.</p><canvas id="gl"></canvas></header>
  <section class="pin" id="pinned"><div>Pinned section</div></section>
  <section><h2>After the pin</h2><p>Plain content.</p></section>
  <footer style="padding:24px">Footer</footer>
  <script>
    const c = document.getElementById("gl");
    const gl = c.getContext("webgl");
    if (gl) { let t = 0; const f = () => { t += 0.02; gl.clearColor(0.1, 0.5 + 0.2 * Math.sin(t), 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT); requestAnimationFrame(f); }; f(); }
  </script>
</body>
</html>
